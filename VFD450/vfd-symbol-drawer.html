<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VFD Matrix Drawer</title>
    <style>
      body {
        font-family: monospace;
        background: #121212;
        color: #00ffcc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .vfd-container {
        background: #000;
        padding: 40px;
        border: 4px solid #333;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .char-block {
        display: flex;
        align-items: flex-end;
        gap: 15px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 45px);
        grid-gap: 5px;
      }
      .dot {
        width: 45px;
        height: 45px;
        background: #1a1a1a;
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid #222;
      }
      .dot.active {
        background: #00ffcc;
        box-shadow: 0 0 15px #00ffcc;
      }

      .semicolon-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 5px;
      }
      .semi-dot {
        width: 15px;
        height: 15px;
        background: #1a1a1a;
        cursor: pointer;
        border-radius: 2px;
      }
      .comma {
        width: 15px;
        height: 25px;
        background: #1a1a1a;
        cursor: pointer;
        border-radius: 0 0 10px 2px;
      }
      .active {
        background: #00ffcc !important;
        box-shadow: 0 0 10px #00ffcc;
      }

      .annunciators {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 245px;
      }

      .bar {
        width: 100%;
        height: 15px;
        background: #1a1a1a;
        cursor: pointer;
        border-radius: 2px;
      }
      .triangle-container {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .triangle {
        width: 0;
        height: 0;
        border-left: 122px solid transparent;
        border-right: 122px solid transparent;
        border-top: 60px solid #1a1a1a;
        cursor: pointer;
      }

      .bar.active {
        background: #00ffcc;
        box-shadow: 0 0 15px #00ffcc;
      }
      .tri-active {
        border-top-color: #00ffcc !important;
        filter: drop-shadow(0 0 10px #00ffcc);
      }

      .btn-clear {
        margin-top: 40px;
        background: #442222;
        color: #ff9999;
        border: 1px solid #663333;
        padding: 15px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        letter-spacing: 2px;
      }
      .btn-clear:hover {
        background: #663333;
      }
    </style>
  </head>
  <body>
    <div class="vfd-container">
      <div class="char-block">
        <div class="grid" id="grid"></div>

        <div class="semicolon-group">
          <div class="semi-dot" onclick="this.classList.toggle('active')"></div>
          <div class="comma" onclick="this.classList.toggle('active')"></div>
        </div>
      </div>

      <div class="annunciators">
        <div
          class="bar"
          id="bar"
          onclick="this.classList.toggle('active')"
        ></div>
        <div class="triangle-container">
          <div class="triangle" id="tri" onclick="toggleTri()"></div>
        </div>
      </div>

      <button class="btn-clear" onclick="clearAll()">CLEAR ALL</button>
    </div>

    <script>
      const grid = document.getElementById("grid");
      for (let i = 0; i < 35; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.onclick = () => dot.classList.toggle("active");
        grid.appendChild(dot);
      }

      function toggleTri() {
        document.getElementById("tri").classList.toggle("tri-active");
      }

      function clearAll() {
        document.querySelectorAll(".active, .tri-active").forEach((el) => {
          el.classList.remove("active");
          el.classList.remove("tri-active");
        });
      }
    </script>
  </body>
</html>
